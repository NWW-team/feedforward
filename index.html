<style>
  :root {

  html { -webkit-text-size-adjust: 100%; }
  body {

  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 0 16px; }

  /* Voorbeelddata-balk: moet op elk scherm zichtbaar zijn */
  .demobalk {
    background: var(--waarschuwing);
    color: #1b1b1b;
    font-weight: 700;
    padding: 10px 0;
  }
  .demobalk .wrap { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; }
  .demobalk span { font-weight: 400; }

  header.hoofd { background: var(--blauw); color: #fff; padding: 28px 0 32px; }
  header.hoofd h1 { margin: 0 0 6px; font-size: 1.7rem; line-height: 1.2; }
  header.hoofd p { margin: 0; color: #cfdcea; max-width: 60ch; }

  main { padding: 28px 0 8px; }
  h2 { font-size: 1.25rem; margin: 0 0 4px; }
  .subtitel { color: var(--grijs); margin: 0 0 20px; }

  ul.paginas { list-style: none; margin: 0; padding: 0; display: grid; gap: 12px; }
  .kaart {
    background: var(--vlak);
    border: 1px solid var(--lijn);
    border-left: 5px solid var(--blauw);
    border-radius: 4px;
  }
  a.kaartlink {
    display: block; padding: 16px 18px; text-decoration: none; color: inherit;
  }
  a.kaartlink:hover { background: var(--blauw-licht); }
  a.kaartlink:focus-visible { outline: 3px solid var(--waarschuwing); outline-offset: -3px; }
  .kaart h3 { margin: 0 0 6px; font-size: 1.05rem; color: var(--blauw); text-decoration: underline; }
  .kaart p { margin: 0 0 10px; color: var(--tekst); }
  .cijfers { display: flex; gap: 16px; flex-wrap: wrap; color: var(--grijs); font-size: .875rem; }
  .cijfers b { color: var(--rood); font-variant-numeric: tabular-nums; }

  .terug { display: inline-block; margin-bottom: 16px; color: var(--blauw); font-weight: 600; }
  .paginakop { background: var(--vlak); border: 1px solid var(--lijn); border-radius: 4px; padding: 18px; margin-bottom: 20px; }
  .paginakop h2 { margin-bottom: 8px; }
  .paginakop .bron { font-size: .875rem; word-break: break-all; }

  .oorzaak {
    background: var(--vlak); border: 1px solid var(--lijn); border-radius: 4px;
    padding: 18px; margin-bottom: 16px;
  }
  .oorzaak h3 { margin: 0 0 4px; font-size: 1.1rem; }
  .telling { color: var(--grijs); font-size: .875rem; margin: 0 0 10px; }
  .oorzaak > p.toelichting { margin: 0 0 16px; }
  h4 { font-size: .8rem; text-transform: uppercase; letter-spacing: .06em; color: var(--grijs); margin: 0 0 8px; }

  blockquote {
    margin: 0 0 8px; padding: 8px 0 8px 14px;
    border-left: 3px solid var(--lijn); color: #333;
  }
  blockquote footer { color: var(--grijs); font-size: .8rem; margin-top: 2px; }

  ol.suggesties { margin: 0; padding-left: 1.25em; }
  ol.suggesties li { margin-bottom: 8px; }
  ol.suggesties li:last-child { margin-bottom: 0; }

  .bewijs { background: var(--grond); border-radius: 4px; padding: 14px; margin-bottom: 16px; }
  .advies { border: 1px solid var(--blauw-licht); background: var(--blauw-licht); border-radius: 4px; padding: 14px; }

  button.kopieer {
    margin-top: 14px; font: inherit; font-weight: 600;
    background: var(--blauw); color: #fff; border: 0; border-radius: 4px;
    padding: 10px 16px; cursor: pointer;
  }
  button.kopieer:hover { background: #0f3057; }
  button.kopieer:focus-visible { outline: 3px solid var(--waarschuwing); outline-offset: 2px; }

  details.ruwe { margin-top: 8px; }
  details.ruwe summary { cursor: pointer; color: var(--blauw); font-weight: 600; padding: 8px 0; }
  details.ruwe ul { margin: 8px 0 0; padding-left: 1.1em; color: #333; }
  details.ruwe li { margin-bottom: 6px; }

  footer.verantwoording {
    margin-top: 32px; border-top: 4px solid var(--blauw);
    background: var(--vlak); padding: 22px 0 40px; color: var(--grijs); font-size: .9rem;
  }
  footer.verantwoording h2 { font-size: 1rem; color: var(--tekst); }
  footer.verantwoording dl { display: grid; grid-template-columns: max-content 1fr; gap: 4px 16px; margin: 12px 0; }
  footer.verantwoording dt { font-weight: 600; color: var(--tekst); }
  footer.verantwoording dd { margin: 0; }
  footer.verantwoording .let-op { color: var(--tekst); background: var(--waarschuwing-vlak); border-left: 4px solid var(--waarschuwing); padding: 10px 14px; }

  @media (max-width: 480px) {
    header.hoofd h1 { font-size: 1.35rem; }
    footer.verantwoording dl { grid-template-columns: 1fr; gap: 0 0; }
    footer.verantwoording dd { margin-bottom: 8px; }
  }
</style>
</head>

<script>
(function () {
  "use strict";

  var data = JSON.parse(document.getElementById("feedforward-data").textContent);
  var scherm = document.getElementById("scherm");

  // Feedback op id, zodat een citaat nooit los kan komen te staan van de bron.
  var perId = {};
  data.feedback.forEach(function (f) { perId[f.id] = f; });

  function vanPagina(paginaId) {
    return data.feedback.filter(function (f) { return f.pagina === paginaId; });
  }
  function zonderAntwoord(items) {
    return items.filter(function (f) { return !f.beantwoord; });
  }

  function el(tag, opties) {
    var n = document.createElement(tag);
    if (opties && opties.tekst) n.textContent = opties.tekst;
    if (opties && opties.klasse) n.className = opties.klasse;
    if (opties && opties.href) n.href = opties.href;
    return n;
  }

  function toonOverzicht() {
    document.title = "Feedforward — verbetersuggesties uit bezoekersfeedback";
    scherm.textContent = "";

    var h2 = el("h2", { tekst: "Pagina's over reisdocumenten" });
    var sub = el("p", { klasse: "subtitel" });
    sub.textContent = data.paginas.length + " pagina's, " + data.feedback.length +
      " feedbackitems uit de periode " + data.meta.periode + ". Kies een pagina.";
    scherm.appendChild(h2);
    scherm.appendChild(sub);

    var lijst = el("ul", { klasse: "paginas" });

    data.paginas
      .map(function (p) {
        var items = vanPagina(p.id);
        return { pagina: p, totaal: items.length, nee: zonderAntwoord(items).length };
      })
      .sort(function (a, b) { return b.nee - a.nee; })
      .forEach(function (r) {
        var li = el("li", { klasse: "kaart" });
        var a = el("a", { klasse: "kaartlink", href: "#/" + r.pagina.id });

        a.appendChild(el("h3", { tekst: r.pagina.titel }));
        a.appendChild(el("p", { tekst: r.pagina.samenvatting }));

        var cijfers = el("div", { klasse: "cijfers" });
        var c1 = el("span");
        c1.appendChild(document.createTextNode("Kreeg geen antwoord: "));
        c1.appendChild(el("b", { tekst: r.nee + " van de " + r.totaal }));
        cijfers.appendChild(c1);
        cijfers.appendChild(el("span", {
          tekst: r.pagina.oorzaken.length + " herkende oorzaken"
        }));
        a.appendChild(cijfers);

        li.appendChild(a);
        lijst.appendChild(li);
      });

    scherm.appendChild(lijst);
  }

  function suggestiesAlsTekst(pagina) {
    var regels = ["Verbetersuggesties — " + pagina.titel, pagina.url, ""];
    pagina.oorzaken.forEach(function (o, i) {
      regels.push((i + 1) + ". " + o.titel + " (" + o.citaat_ids.length + " signalen)");
      o.suggesties.forEach(function (s) { regels.push("   - " + s); });
      regels.push("");
    });
    regels.push("Bron: " + data.meta.bron + ", periode " + data.meta.periode + ".");
    regels.push("Let op: door AI gegenereerd, niet redactioneel gecontroleerd.");
    return regels.join("\n");
  }

  function toonPagina(pagina) {
    document.title = pagina.titel + " — Feedforward";
    scherm.textContent = "";

    var terug = el("a", { klasse: "terug", href: "#/", tekst: "← Alle pagina's" });
    scherm.appendChild(terug);

    var items = vanPagina(pagina.id);
    var nee = zonderAntwoord(items).length;

    var kop = el("div", { klasse: "paginakop" });
    kop.appendChild(el("h2", { tekst: pagina.titel }));
    var cijfers = el("p", { klasse: "cijfers" });
    cijfers.appendChild(el("span", { tekst: items.length + " feedbackitems geanalyseerd" }));
    var c2 = el("span");
    c2.appendChild(document.createTextNode("Kreeg geen antwoord: "));
    c2.appendChild(el("b", { tekst: nee + " van de " + items.length }));
    cijfers.appendChild(c2);
    kop.appendChild(cijfers);
    var bron = el("p", { klasse: "cijfers bron" });
    var bronLink = el("a", { href: pagina.url, tekst: pagina.url });
    bronLink.rel = "noopener";
    bron.appendChild(document.createTextNode("Pagina: "));
    bron.appendChild(bronLink);
    kop.appendChild(bron);
    scherm.appendChild(kop);

    pagina.oorzaken.forEach(function (o) {
      var sectie = el("section", { klasse: "oorzaak" });
      sectie.appendChild(el("h3", { tekst: o.titel }));
      sectie.appendChild(el("p", {
        klasse: "telling",
        tekst: "Teruggezien in " + o.citaat_ids.length + " van de " + items.length + " reacties"
      }));
      sectie.appendChild(el("p", { klasse: "toelichting", tekst: o.toelichting }));

      var bewijs = el("div", { klasse: "bewijs" });
      bewijs.appendChild(el("h4", { tekst: "Wat bezoekers schreven" }));
      // Eerste twee citaten direct zichtbaar, de rest inklapbaar.
      o.citaat_ids.slice(0, 2).forEach(function (id) {
        bewijs.appendChild(citaat(id));
      });
      if (o.citaat_ids.length > 2) {
        var meer = el("details", { klasse: "ruwe" });
        var sum = el("summary", {
          tekst: "Nog " + (o.citaat_ids.length - 2) + " vergelijkbare reacties"
        });
        meer.appendChild(sum);
        o.citaat_ids.slice(2).forEach(function (id) { meer.appendChild(citaat(id)); });
        bewijs.appendChild(meer);
      }
      sectie.appendChild(bewijs);

      var advies = el("div", { klasse: "advies" });
      advies.appendChild(el("h4", { tekst: "Verbetersuggesties" }));
      var ol = el("ol", { klasse: "suggesties" });
      o.suggesties.forEach(function (s) { ol.appendChild(el("li", { tekst: s })); });
      advies.appendChild(ol);
      sectie.appendChild(advies);

      scherm.appendChild(sectie);
    });

    var knop = el("button", { klasse: "kopieer", tekst: "Kopieer alle suggesties" });
    knop.type = "button";
    knop.addEventListener("click", function () {
      kopieer(suggestiesAlsTekst(pagina), knop);
    });
    scherm.appendChild(knop);
  }

  function citaat(id) {
    var f = perId[id];
    var bq = el("blockquote");
    bq.appendChild(el("p", { tekst: "“" + f.tekst + "”" }));
    bq.appendChild(el("footer", {
      tekst: "Feedback " + f.id + " · " + (f.beantwoord ? "kreeg wel antwoord" : "kreeg geen antwoord")
    }));
    return bq;
  }

  function kopieer(tekst, knop) {
    function gelukt() {
      var was = knop.textContent;
      knop.textContent = "Gekopieerd";
      setTimeout(function () { knop.textContent = was; }, 2000);
    }
    if (navigator.clipboard && window.isSecureContext) {
      navigator.clipboard.writeText(tekst).then(gelukt, function () { viaVeld(tekst, gelukt); });
    } else {
      viaVeld(tekst, gelukt);
    }
  }

  // Terugval voor browsers of een file:// -context zonder clipboard-API.
  function viaVeld(tekst, gelukt) {
    var ta = document.createElement("textarea");
    ta.value = tekst;
    ta.setAttribute("readonly", "");
    ta.style.position = "fixed";
    ta.style.left = "-9999px";
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); gelukt(); } catch (e) { ta.style.left = "0"; }
    document.body.removeChild(ta);
  }

  function route() {
    var id = (location.hash || "").replace(/^#\/?/, "");
    var pagina = data.paginas.filter(function (p) { return p.id === id; })[0];
    if (pagina) { toonPagina(pagina); } else { toonOverzicht(); }
    window.scrollTo(0, 0);
  }

  function vulVerantwoording() {
    var dl = document.getElementById("verantwoording");
    var rijen = [
      ["Bron", data.meta.bron],
      ["Onderwerp", data.meta.onderwerp],
      ["Periode", data.meta.periode],
      ["Export", data.meta.export_datum],
      ["Analyse gemaakt op", data.meta.analyse_datum],
      ["Omvang", data.feedback.length + " feedbackitems over " + data.paginas.length + " pagina's"]
    ];
    rijen.forEach(function (r) {
      dl.appendChild(el("dt", { tekst: r[0] }));
      dl.appendChild(el("dd", { tekst: r[1] }));
    });
    document.getElementById("disclaimer").textContent = data.meta.disclaimer;
  }

  window.addEventListener("hashchange", route);
  vulVerantwoording();
  route();
})();
</script>
</body>
</html>
